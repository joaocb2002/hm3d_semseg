name: quality

on:
  push:
  pull_request:

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install repository quality environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --constraint constraints/quality.txt
      - name: Ruff
        run: ruff check .
      - name: Strict typing
        run: mypy src
      - name: Unit tests
        run: python -m pytest -m unit
