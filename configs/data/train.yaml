  class_aware_fraction: 0.0
dataset:
  schema_version: "1.0"
  name: train-v1
  split: train
  output_dir: null
  rgb_codec: jpeg
  jpeg_quality: 95
  store_depth: false
  max_scenes: null
  max_samples_per_scene: 512
  validation_only: false
